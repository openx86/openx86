name: SystemVerilog Tests (verilator)

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master
  workflow_dispatch: {}

# 依赖 GHCR 预编译镜像（.github/workflows/verilator-ci-image.yml）。合并本改动后请先手动运行该 workflow 完成首次推送。

permissions:
  contents: read
  packages: read

jobs:
  # GHCR 镜像名必须小写；单独 job 输出供 container.image 使用（表达式里无法直接 toLower）
  verilator-image-ref:
    name: Resolve Verilator CI image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - id: ref
        run: |
          owner_repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${owner_repo}:verilator-5.046" >> "$GITHUB_OUTPUT"

  test-ubuntu:
    name: verilator (Ubuntu)
    needs: verilator-image-ref
    runs-on: ubuntu-latest
    # 使用 GHCR 预编译镜像，避免每次 CI 编译 Verilator（由 verilator-ci-image.yml 构建推送）
    container:
      image: ${{ needs.verilator-image-ref.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Verilator 对每个 TB 单独整库编译，全量耗时可观；CI 通过 VERILATOR_TB_LIST 跑代表性子集。
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Verilator
        run: verilator --version

      - name: Lint all rtl/*.sv (verilator --lint-only)
        run: |
          chmod +x scripts/lint_rtl_verilator.sh
          ./scripts/lint_rtl_verilator.sh

      - name: Run testbenches (verilator)
        env:
          VERILATOR_TB_LIST: sim/filelists/ci_verilator_tbs.txt
          VERILATOR_RUN_TIMEOUT: "600"
        run: |
          chmod +x scripts/test_all_verilator.sh scripts/sim_tb_verilator.sh
          ./scripts/test_all_verilator.sh build || {
            echo "测试失败！"
            echo "失败的测试日志:"
            ls -la *_compile.log *_run.log 2>/dev/null || true
            exit 1
          }

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: verilator-test-logs
          path: |
            *_compile.log
            *_run.log
          retention-days: 7

      - name: Upload test logs (on success)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: verilator-test-logs-success
          path: |
            *_compile.log
            *_run.log
          retention-days: 1
          if-no-files-found: ignore

