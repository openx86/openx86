name: SystemVerilog Tests (iverilog)

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-ubuntu:
    name: iverilog (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Verify iverilog installation
        run: |
          which iverilog
          which vvp
          iverilog -V
          vvp -V

      - name: Check syntax + run all testbenches (iverilog)
        run: |
          chmod +x scripts/test_all.sh check_syntax.sh test_all_modules.sh
          ./scripts/test_all.sh || {
            echo "测试失败！"
            echo "失败的测试日志:"
            ls -la *_compile.log *_run.log 2>/dev/null || true
            exit 1
          }

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: iverilog-test-logs
          path: |
            *_compile.log
            *_run.log
          retention-days: 7

      - name: Upload test logs (on success)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: iverilog-test-logs-success
          path: |
            *_compile.log
            *_run.log
          retention-days: 1
          if-no-files-found: ignore

  test-windows:
    name: iverilog (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install iverilog (choco)
        shell: powershell
        run: |
          choco install iverilog --no-progress -y
          iverilog -V
          vvp -V

      - name: Run all testbenches (PowerShell, iverilog)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/test_all.ps1"

